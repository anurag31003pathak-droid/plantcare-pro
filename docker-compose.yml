version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: plantcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d plantcare" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/plantcare
      - MODEL_PATH=/app/ml_model_mock.h5 # Placeholder, can be mapped from volume if true model exists
    volumes:
      - ./ml:/app/ml # Mount ML directory so backend can access trained model if present
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
      - "5173:5173" # For local dev if mounted
    depends_on:
      - backend

volumes:
  postgres_data:
